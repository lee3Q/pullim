# 제안서 템플릿
# 사용법: 이 파일을 복사하여 YYYY-MM-DD_제안제목.yaml 로 저장
# 어떤 팀원이든 제안 가능 → 일일 회의 상정 → Consent 라운드 → 대표 승인

제안자:           # 이름 (예: 서윤하)
일자:             # YYYY-MM-DD
유형:             # 기능 / 프로세스 / 인원 / 전략 / 기타
제목:             # 한 줄 제목

배경: |
  왜 이 제안이 필요한가? 현재 상황과 문제점.

내용: |
  구체적으로 무엇을 하자는 것인가?

예상_효과:        # 어떤 개선이 기대되는가
예상_비용:        # 시간 / 토큰 / 금전
리스크:           # 실패 시 어떤 영향

의사결정_등급:    # 운영급(L2) / 전술급(L1) / 전략급(L0)

