# Ouroboros Seed Specification
# Generated: 2026-03-07
# Source: ooo interview -> positioning research -> tech design
# Ambiguity Score: 0.15 (low — major decisions resolved via 5-agent team + research)

goal: >
  멘탈케어 + 의사결정 하이브리드 PWA 웹앱 구축.
  사용자가 자유 텍스트로 고민을 입력하면, 멀티 에이전트 토론 기반 파이프라인을 거쳐
  다각도 분석 + 구조화된 의사결정 정리 문서를 생성한다.
  v2 파이프라인: 듣기 → 전문가 선택/추천 → 에이전트 3명 병렬 분석 → 토론 → 착지 + 리포트.
  포지셔닝: 멘탈케어/심리 웰니스 앱.
  차별화: "프롬프트가 아니라 파이프라인" — 상태 관리 + 오케스트레이션 + 안전 레이어.
  메시지: "전문가를 대체하는 게 아니라, 비용을 최소화하여 다양한 관점에서 의견을 들어보는 경험."

constraints:
  # Tech Stack
  - "Next.js 15 (App Router) — SSR + PWA"
  - "Supabase (Postgres + Auth + Storage) — Row Level Security"
  - "Vercel 배포"
  - "Claude Opus 4.6 — 에이전트 분석/토론용 (멀티 에이전트 병렬 3명)"
  - "Claude Sonnet 4.6 — 메인 LLM (듣기/착지 단계, 진행 관리, 리포트 생성)"
  - "Claude Haiku 4.5 — 라우팅 전용 (4축 분류, 저비용)"
  - "next-pwa — 모바일 앱 경험"
  - "TypeScript 전체"

  # Auth
  - "익명 사용 기본 (localStorage) — 로그인 없이 즉시 사용"
  - "선택적 Google/Kakao 소셜 로그인 — Supabase Auth"
  - "로그인 시 로컬 데이터 클라우드 동기화"

  # Positioning
  - "의료기기 아닌 웰니스/코칭으로 포지셔닝 (규제 회피)"
  - "프레임워크 이름 사용자에게 노출 금지 (내부 엔진만)"
  - "한국어 우선 (UI/프롬프트 전체)"

  # Safety
  - "자해/자살 관련 입력 → 위기 감지 + 전문 상담 연결 (v1 필수)"
  - "불법 행위 → disclaimer + 전문가 연결"

acceptance_criteria:
  # Core Pipeline (v2 — 멀티 에이전트 토론)
  - "v2 파이프라인 완전 동작: 듣기 → 전문가 선택/추천 → 에이전트 3명 병렬 분석 → 토론 → 착지 + 리포트"
  - "듣기 단계: Socratic 질문으로 고민 파악, 코칭기법(Mirroring, Powerful Questions, Reframing) 내장"
  - "전문가 선택: 추천(고민 유형 기반 자동) 또는 직접 선택 (전문가 풀에서 3명)"
  - "에이전트 병렬 분석: 선택된 3명이 각자 독립 분석 (500자 이내 + 질문 1개)"
  - "에이전트 토론: 사용자 선택 관점에 나머지 2명 반론 → 종합 분석"
  - "착지: 종합 리포트 화면 출력 + 의사결정 정리 문서(첫 걸음) 자동 생성"
  - "진행도 표시: 5단계 게이지 (이야기 듣기/전문가 구성/분석/토론/정리)"

  # Expert Pool
  - "기본 전문가: 심리 상담사, 경영 컨설턴트, 철학자, 의사, 진로 전문가"
  - "확장 전문가: 법률가, 재무 전문가, 교육 전문가, 행동과학자, 역발상가, 갈등 조정 전문가, 전략가, 행동경제학자"
  - "고민 유형별 추천 조합 로직 구현"

  # Routing
  - "Haiku 4축 자동 라우팅 (가역성/정보충분성/감정개입/시간압박)"
  - "라우팅 결과를 사용자 친화적 언어로 안내 (프레임워크명 숨김)"
  - "사용자가 다른 모드 선택 가능"

  # Decision Summary Document
  - "앱 내 웹 페이지로 렌더링 — 정리 문서(첫 걸음): 문제/맥락/선택지/평가/리스크/결정/근거/첫행동"
  - "공유 가능한 링크 생성"

  # Auth & Storage
  - "비로그인 사용자: localStorage에 세션 데이터 저장"
  - "로그인 사용자: Supabase에 세션 히스토리 저장 (RLS)"
  - "Google/Kakao OAuth 동작"

  # UX
  - "빈 입력창 하나로 시작 (Perplexity 패턴)"
  - "대화형 UI (채팅 + 버튼 선택 혼합)"
  - "실시간 분석 진행바/스트리밍"
  - "PWA 설치 가능 (모바일)"
  - "반응형 디자인 (모바일 우선)"

  # Safety
  - "위기 감지 키워드 → 전문 상담 연결 화면"

  # Business
  - "무료 월 1회 풀 Sonnet 세션 (라우팅만 Haiku)"
  - "프리미엄 잠금 표시 (결제 연동은 후속)"

ontology_schema:
  name: ClarifyEngine
  description: "멘탈케어 + 의사결정 하이브리드 앱의 핵심 도메인 모델 (구체화 엔진)"
  fields:
    # Session
    - name: session
      type: object
      description: "하나의 의사결정 세션"
      fields:
        - name: id
          type: string
          description: "세션 고유 ID (UUID)"
        - name: user_id
          type: string
          description: "사용자 ID (anonymous 또는 auth user)"
        - name: input_text
          type: string
          description: "사용자 초기 고민 입력 (자유 텍스트)"
        - name: model_type
          type: string
          description: "선택된 모델 (A|B|C|D|E|F)"
        - name: routing_scores
          type: object
          description: "4축 라우팅 점수 (reversibility, info_sufficiency, emotional_involvement, time_pressure)"
        - name: current_stage
          type: string
          description: "현재 파이프라인 단계 (LISTEN|UNPACK|LAND|COMPLETE) — 3단계: 듣기→풀기→착지"
        - name: stages
          type: array
          description: "각 단계의 대화 기록 및 산출물"
        - name: decision_record
          type: object
          description: "최종 의사결정 정리 문서"
        - name: created_at
          type: string
          description: "세션 생성 시각 (ISO 8601)"
        - name: completed_at
          type: string
          description: "세션 완료 시각 (ISO 8601, nullable)"

    # Stage
    - name: stage
      type: object
      description: "파이프라인의 한 단계"
      fields:
        - name: stage_name
          type: string
          description: "단계 이름 (LISTEN|UNPACK|LAND) — 듣기/풀기/착지"
        - name: messages
          type: array
          description: "이 단계의 대화 메시지 목록 [{role, content, timestamp}]"
        - name: output
          type: object
          description: "이 단계의 구조화된 산출물"
        - name: status
          type: string
          description: "단계 상태 (pending|active|completed|skipped)"

    # Decision Record
    - name: decision_record
      type: object
      description: "의사결정 정리 문서"
      fields:
        - name: problem
          type: string
          description: "구조화된 문제 정의 (CLARIFY 산출물)"
        - name: context
          type: string
          description: "맥락 요약 (CONTEXT 산출물)"
        - name: options
          type: array
          description: "선택지 목록 [{name, description, pros, cons}]"
        - name: evaluation
          type: object
          description: "평가 매트릭스 (기준 x 선택지 점수)"
        - name: risks
          type: array
          description: "리스크/편향 목록 (STRESS TEST 산출물)"
        - name: decision
          type: string
          description: "최종 결정 (DECIDE 산출물)"
        - name: rationale
          type: string
          description: "결정 근거"
        - name: first_action
          type: string
          description: "첫 행동 1개 (COMMIT 산출물)"
        - name: review_date
          type: string
          description: "리뷰 예정일"
        - name: share_id
          type: string
          description: "공유 링크용 ID"

    # User
    - name: user
      type: object
      description: "사용자 프로필"
      fields:
        - name: id
          type: string
          description: "사용자 ID"
        - name: auth_type
          type: string
          description: "인증 유형 (anonymous|google|kakao)"
        - name: session_count
          type: number
          description: "이번 달 사용 세션 수"
        - name: tier
          type: string
          description: "요금제 (free|premium)"
        - name: created_at
          type: string
          description: "가입일"

evaluation_principles:
  - name: socratic_depth
    description: "각 단계에서 표면 질문이 아닌 진짜 질문을 파고드는 깊이. '이직할까'→'확신 없는 걸 해야 하나'로 리프레이밍되는가?"
    weight: 0.25

  - name: decision_quality
    description: "최종 정리 문서가 문제/맥락/선택지/평가/리스크/결정/근거/첫행동을 빠짐없이 포함하고, 논리적으로 일관되는가?"
    weight: 0.25

  - name: user_experience
    description: "비기술자가 프레임워크 이름 모르고도 자연스럽게 3단계를 완주할 수 있는가? 입력→결과 흐름이 매끄러운가?"
    weight: 0.20

  - name: emotional_safety
    description: "감정이 얽힌 고민에서 사용자를 안전하게 보호하는가? 위기 감지가 동작하는가? 웰니스 톤을 유지하는가?"
    weight: 0.15

  - name: completion_rate
    description: "사용자가 중도 이탈하지 않고 COMMIT 단계까지 도달하는 비율. 각 단계 전환이 자연스러운가?"
    weight: 0.15

exit_conditions:
  - name: pipeline_complete
    description: "v2 멀티 에이전트 파이프라인이 end-to-end로 동작"
    criteria: "듣기→전문가선택→병렬분석→토론→착지까지 완주하고 리포트+정리 문서(첫 걸음) 생성"

  - name: expert_selection
    description: "전문가 선택/추천 시스템 동작"
    criteria: "추천 모드(고민 유형 기반 자동 3인) + 직접 선택 모드(풀에서 3인) 모두 동작"

  - name: agent_orchestration
    description: "에이전트 3명 병렬 분석 + 토론 오케스트레이션"
    criteria: "3명 독립 분석 → 사용자 선택 관점 기반 토론 → 종합 결과 생성"

  - name: decision_document_render
    description: "의사결정 정리 문서가 웹 페이지로 렌더링"
    criteria: "문서 페이지 접근 가능 + 공유 링크 동작"

  - name: auth_flow
    description: "인증 흐름 완전 동작"
    criteria: "익명 사용 → 소셜 로그인 → 로컬 데이터 클라우드 동기화"

  - name: pwa_installable
    description: "PWA로 모바일 설치 가능"
    criteria: "manifest + service worker + 설치 프롬프트 동작"

  - name: safety_gate
    description: "위기 감지 안전장치"
    criteria: "위기 키워드 입력 시 전문 상담 연결 화면 표시"

